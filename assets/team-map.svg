    <text class="sans" x="1060" y="273" font-size="11" text-anchor="middle" fill="#5A6663">acts as journal reviewers</text>
    <rect x="972" y="282" width="176" height="16" rx="4" fill="#E6EAF3"/>
    <text class="mono" x="1060" y="293.5" font-size="10" text-anchor="middle" fill="#39445E">PDF only — never your notes</text>
  </g>
  <g>
    <polygon points="912,344 1200,344 1226,390 1200,436 912,436 886,390" fill="#A9761C"/>
    <polygon points="913.5,346.5 1198.5,346.5 1223,390 1198.5,433.5 913.5,433.5 889,390" fill="#FBF4E4"/>
    <text class="mono" x="1056" y="376" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">regression-guardian</text>
    <text class="sans" x="1056" y="393" font-size="11" text-anchor="middle" fill="#5A6663">the gate — catches silent bugs</text>
    <text class="mono" x="1056" y="413" font-size="10" text-anchor="middle" fill="#A9761C">✓ certify   ·   ✗ back to /dl-engineer</text>
  </g>
