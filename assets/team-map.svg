<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780" role="img" aria-label="How the team works with you: six skills share your session context; four subagents run isolated, receiving a task brief and returning one report; every arrow starts or ends at you.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#435954"/>
    </marker>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
  </style>

  <rect x="0" y="0" width="1320" height="780" fill="#F3F5F4"/>

  <text class="mono" x="36" y="34" font-size="11" letter-spacing="2" fill="#5A6663">CLAUDE_RESEARCH_TEAM</text>
  <text class="sans" x="36" y="66" font-size="26" font-weight="700" fill="#1D2523">How the team works with you</text>

  <text class="mono" x="801" y="97" font-size="11" text-anchor="middle" fill="#5A6663">context boundary — only a task brief goes out; only a report comes back</text>

  <rect x="36" y="110" width="720" height="530" rx="12" fill="#E3EDE9"/>
  <rect x="846" y="110" width="420" height="530" rx="12" fill="#E6EAF3"/>
  <text class="mono" x="56" y="140" font-size="11" letter-spacing="1.5" fill="#3E544E">YOUR SESSION — ONE SHARED CONTEXT</text>
  <text class="mono" x="866" y="140" font-size="11" letter-spacing="1.5" fill="#39445E">DISPATCHED — ISOLATED CONTEXT</text>

  <line x1="801" y1="110" x2="801" y2="640" stroke="#7E8B87" stroke-width="1.5" stroke-dasharray="7 7"/>

  <polyline points="195,390 232,390" fill="none" stroke="#9DB3AC" stroke-width="1.2"/>
