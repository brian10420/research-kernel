    <text class="mono" x="610" y="563.5" font-size="10" text-anchor="middle" fill="#3E544E">Study Log</text>
  </g>
  <g>
    <rect x="268" y="644" width="214" height="92" rx="10" fill="#FDFEFD" stroke="#0F6B62" stroke-width="1.5"/>
    <text class="mono" x="375" y="676" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">/science-presenter</text>
    <text class="sans" x="375" y="693" font-size="11" text-anchor="middle" fill="#5A6663">makes slides &amp; posters for others</text>
    <rect x="336" y="702" width="78" height="16" rx="4" fill="#E3EDE9"/>
    <text class="mono" x="375" y="713.5" font-size="10" text-anchor="middle" fill="#3E544E">brief first</text>
  </g>

  <g>
    <rect x="886" y="224" width="340" height="92" rx="8" fill="#FDFEFD" stroke="#41507A" stroke-width="1.5"/>
    <line x1="890.5" y1="227" x2="890.5" y2="313" stroke="#41507A" stroke-width="1.5"/>
    <line x1="894" y1="227" x2="894" y2="313" stroke="#41507A" stroke-width="1.5"/>
