  <text class="serif" font-size="13" font-style="italic" fill="#4A5651">
    <tspan x="470" y="906">Every arrow starts or ends at you — no role hands work to another directly. The eight skills read your whole</tspan>
    <tspan x="470" y="925">conversation as it happens; each of the four subagents gets one task brief and returns one report across the</tspan>
    <tspan x="470" y="944">boundary. Effort is decided by task shape before the work starts — and max is never set on a role: a role can</tspan>
    <tspan x="470" y="963">only ask for it, and you are the one who turns it up, then back down again.</tspan>
  </text>

  <rect x="40" y="993" width="54" height="16" rx="4" fill="#E4E8E6"/>
