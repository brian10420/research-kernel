  <text class="sans" x="36" y="66" font-size="26" font-weight="700" fill="#1D2523">How the team works with you</text>

  <text class="mono" x="801" y="97" font-size="11" text-anchor="middle" fill="#5A6663">context boundary — only a task brief goes out; only a report comes back</text>

