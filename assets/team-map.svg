  <text class="sans" x="40" y="64" font-size="26" font-weight="700" fill="#1D2523">How the team works with you</text>
  <text class="sans" x="40" y="88" font-size="13.5" fill="#5A6663">Eight skills share your session; four subagents run isolated — and every role's effort is fixed by its task shape, never by how stuck it is.</text>

