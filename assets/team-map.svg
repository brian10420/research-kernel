  <g>
    <line x1="36" y1="814" x2="62" y2="814" stroke="#435954" stroke-width="2"/>
    <path d="M 60 810 L 67 814 L 60 818 z" fill="#435954"/>
    <text class="mono" x="78" y="818" font-size="10.5" fill="#5A6663">hand-off carrying work (always via you)</text>
    <line x1="36" y1="834" x2="67" y2="834" stroke="#9DB3AC" stroke-width="1.2"/>
    <text class="mono" x="78" y="838" font-size="10.5" fill="#5A6663">membership — no arrowhead, nothing moves</text>
    <line x1="36" y1="854" x2="67" y2="854" stroke="#7E8B87" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="mono" x="78" y="858" font-size="10.5" fill="#5A6663">context boundary (the only dashed line)</text>
  </g>

  <text class="serif" font-size="13" font-style="italic" fill="#4A5651">
    <tspan x="420" y="818">Every arrow starts or ends at you — no role hands work to another directly. The seven skills read your</tspan>
    <tspan x="420" y="837">whole conversation as it happens; each of the four subagents receives one task brief and returns one report</tspan>
    <tspan x="420" y="856">across the boundary — and that isolation is what their independence is worth.</tspan>
  </text>
</svg>
