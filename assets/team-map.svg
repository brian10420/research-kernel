<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="930" viewBox="0 0 1320 930" role="img" aria-label="How the team works with you: seven skills share your session context; four subagents run isolated, receiving a task brief and returning one report; every arrow starts or ends at you.">
