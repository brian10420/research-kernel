  <line x1="866" y1="555" x2="884" y2="555" stroke="#435954" stroke-width="2" marker-end="url(#head)"/>
  <line x1="1226" y1="195" x2="1246" y2="195" stroke="#435954" stroke-width="2"/>
  <line x1="1226" y1="315" x2="1246" y2="315" stroke="#435954" stroke-width="2"/>
  <line x1="1226" y1="435" x2="1246" y2="435" stroke="#435954" stroke-width="2"/>
  <line x1="1226" y1="555" x2="1246" y2="555" stroke="#435954" stroke-width="2"/>
  <polyline points="1246,195 1246,612 140,612 140,447" fill="none" stroke="#435954" stroke-width="2" marker-end="url(#head)"/>

  <rect x="775" y="147" width="70" height="17" rx="4" fill="#F3F5F4"/>
  <text class="mono" x="810" y="159.5" font-size="10.5" text-anchor="middle" fill="#435954">task brief</text>
  <rect x="772" y="594" width="76" height="17" rx="4" fill="#F3F5F4"/>
  <text class="mono" x="810" y="606.5" font-size="10.5" text-anchor="middle" fill="#435954">one report</text>

  <circle cx="140" cy="390" r="55" fill="#0F6B62"/>
  <text class="sans" x="140" y="388" font-size="22" font-weight="700" text-anchor="middle" fill="#F3F5F4">YOU</text>
  <text class="sans" x="140" y="406" font-size="10.5" text-anchor="middle" fill="#DCEAE7">the researcher</text>

  <g>
    <rect x="268" y="194" width="214" height="92" rx="10" fill="#FDFEFD" stroke="#0F6B62" stroke-width="1.5"/>
    <text class="mono" x="375" y="236" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">/research-mentor</text>
    <text class="sans" x="375" y="256" font-size="11" text-anchor="middle" fill="#5A6663">discuss ideas &amp; check papers</text>
  </g>
  <g>
    <rect x="503" y="194" width="214" height="92" rx="10" fill="#FDFEFD" stroke="#0F6B62" stroke-width="1.5"/>
    <text class="mono" x="610" y="236" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">/math-reviewer</text>
    <text class="sans" x="610" y="256" font-size="11" text-anchor="middle" fill="#5A6663">checks the math</text>
  </g>
  <g>
    <rect x="268" y="344" width="214" height="92" rx="10" fill="#FDFEFD" stroke="#0F6B62" stroke-width="1.5"/>
    <text class="mono" x="375" y="386" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">/dl-engineer</text>
    <text class="sans" x="375" y="406" font-size="11" text-anchor="middle" fill="#5A6663">writes the code</text>
  </g>
  <g>
    <rect x="503" y="344" width="214" height="92" rx="10" fill="#FDFEFD" stroke="#0F6B62" stroke-width="1.5"/>
    <text class="mono" x="610" y="386" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">/results-analyst</text>
    <text class="sans" x="610" y="406" font-size="11" text-anchor="middle" fill="#5A6663">makes stats &amp; figures</text>
  </g>
  <g>
    <rect x="268" y="494" width="214" height="92" rx="10" fill="#FDFEFD" stroke="#0F6B62" stroke-width="1.5"/>
    <text class="mono" x="375" y="536" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">/paper-writer</text>
    <text class="sans" x="375" y="556" font-size="11" text-anchor="middle" fill="#5A6663">writes the paper with you</text>
  </g>
  <g>
    <rect x="503" y="494" width="214" height="92" rx="10" fill="#FDFEFD" stroke="#0F6B62" stroke-width="1.5"/>
    <text class="mono" x="610" y="526" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">/study-coach</text>
    <text class="sans" x="610" y="543" font-size="11" text-anchor="middle" fill="#5A6663">teaches you, quizzes you</text>
    <rect x="571" y="552" width="78" height="16" rx="4" fill="#E3EDE9"/>
    <text class="mono" x="610" y="563.5" font-size="10" text-anchor="middle" fill="#3E544E">Study Log</text>
  </g>

  <g>
    <rect x="886" y="149" width="340" height="92" rx="8" fill="#FDFEFD" stroke="#41507A" stroke-width="1.5"/>
    <line x1="890.5" y1="152" x2="890.5" y2="238" stroke="#41507A" stroke-width="1.5"/>
    <line x1="894" y1="152" x2="894" y2="238" stroke="#41507A" stroke-width="1.5"/>
    <text class="mono" x="1060" y="181" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">blind-reviewer</text>
    <text class="sans" x="1060" y="198" font-size="11" text-anchor="middle" fill="#5A6663">acts as journal reviewers</text>
    <rect x="972" y="207" width="176" height="16" rx="4" fill="#E6EAF3"/>
    <text class="mono" x="1060" y="218.5" font-size="10" text-anchor="middle" fill="#39445E">PDF only — never your notes</text>
  </g>
  <g>
    <polygon points="912,269 1200,269 1226,315 1200,361 912,361 886,315" fill="#A9761C"/>
    <polygon points="913.5,271.5 1198.5,271.5 1223,315 1198.5,358.5 913.5,358.5 889,315" fill="#FBF4E4"/>
    <text class="mono" x="1056" y="301" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">regression-guardian</text>
    <text class="sans" x="1056" y="318" font-size="11" text-anchor="middle" fill="#5A6663">the gate — catches silent bugs</text>
    <text class="mono" x="1056" y="338" font-size="10" text-anchor="middle" fill="#A9761C">✓ certify   ·   ✗ back to /dl-engineer</text>
  </g>
  <g>
    <rect x="886" y="389" width="340" height="92" rx="8" fill="#FDFEFD" stroke="#41507A" stroke-width="1.5"/>
    <line x1="890.5" y1="392" x2="890.5" y2="478" stroke="#41507A" stroke-width="1.5"/>
    <line x1="894" y1="392" x2="894" y2="478" stroke="#41507A" stroke-width="1.5"/>
    <text class="mono" x="1060" y="421" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">experiment-runner</text>
    <text class="sans" x="1060" y="438" font-size="11" text-anchor="middle" fill="#5A6663">runs the training campaigns</text>
    <rect x="984" y="447" width="152" height="16" rx="4" fill="#E6EAF3"/>
    <text class="mono" x="1060" y="458.5" font-size="10" text-anchor="middle" fill="#39445E">GPU · never cherry-picks</text>
  </g>
  <g>
    <rect x="886" y="509" width="340" height="92" rx="8" fill="#FDFEFD" stroke="#41507A" stroke-width="1.5"/>
    <line x1="890.5" y1="512" x2="890.5" y2="598" stroke="#41507A" stroke-width="1.5"/>
    <line x1="894" y1="512" x2="894" y2="598" stroke="#41507A" stroke-width="1.5"/>
    <text class="mono" x="1060" y="541" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1D2523">repo-maintainer</text>
    <text class="sans" x="1060" y="558" font-size="11" text-anchor="middle" fill="#5A6663">handles GitHub safely</text>
    <rect x="1010" y="567" width="100" height="16" rx="4" fill="#E6EAF3"/>
    <text class="mono" x="1060" y="578.5" font-size="10" text-anchor="middle" fill="#39445E">never-push list</text>
  </g>

  <g>
    <line x1="36" y1="664" x2="62" y2="664" stroke="#435954" stroke-width="2"/>
    <path d="M 60 660 L 67 664 L 60 668 z" fill="#435954"/>
    <text class="mono" x="78" y="668" font-size="10.5" fill="#5A6663">hand-off carrying work (always via you)</text>
    <line x1="36" y1="684" x2="67" y2="684" stroke="#9DB3AC" stroke-width="1.2"/>
    <text class="mono" x="78" y="688" font-size="10.5" fill="#5A6663">membership — no arrowhead, nothing moves</text>
    <line x1="36" y1="704" x2="67" y2="704" stroke="#7E8B87" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="mono" x="78" y="708" font-size="10.5" fill="#5A6663">context boundary (the only dashed line)</text>
  </g>

  <text class="serif" font-size="13" font-style="italic" fill="#4A5651">
    <tspan x="420" y="668">Every arrow starts or ends at you — no role hands work to another directly. The six skills read your whole</tspan>
    <tspan x="420" y="687">conversation as it happens; each of the four subagents receives one task brief and returns one report across</tspan>
    <tspan x="420" y="706">the boundary — and that isolation is what their independence is worth.</tspan>
  </text>
</svg>
